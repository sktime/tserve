<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc">
  <title id="title">FoMo architecture</title>
  <desc id="desc">Request path from client through independent transports, Narwhals coercion, scheduler, and independent executor backends.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#44403C"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#B45309"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#57534E"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="40" y="42" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C1917">FoMo architecture</text>
  <text x="1360" y="42" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#78716C">swappable transports · canonical frames · independent executors</text>

  <!-- ========== CLIENT ========== -->
  <rect x="40" y="62" width="1320" height="96" rx="12" fill="#F5F5F4" stroke="#E7E5E4"/>
  <text x="60" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#78716C">CLIENT</text>
  <text x="60" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#1C1917">Caller</text>
  <text x="60" y="134" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#57534E">Same package as the server. Pass a frame; get the same type back.</text>

  <!-- input type pills -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="550">
    <rect x="720" y="92" width="52" height="26" rx="13" fill="#FFFFFF" stroke="#D6D3D1"/>
    <text x="746" y="110" text-anchor="middle" fill="#1C1917">dict</text>
    <rect x="780" y="92" width="68" height="26" rx="13" fill="#FFFFFF" stroke="#D6D3D1"/>
    <text x="814" y="110" text-anchor="middle" fill="#1C1917">pandas</text>
    <rect x="856" y="92" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#D6D3D1"/>
    <text x="887" y="110" text-anchor="middle" fill="#1C1917">polars</text>
    <rect x="926" y="92" width="70" height="26" rx="13" fill="#FFFFFF" stroke="#D6D3D1"/>
    <text x="961" y="110" text-anchor="middle" fill="#1C1917">pyarrow</text>
  </g>
  <text x="720" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1917">ForecastRequest (Any)</text>
  <text x="1340" y="140" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1917">ForecastResponse (Any)</text>

  <!-- down arrow: request -->
  <line x1="200" y1="158" x2="200" y2="186" stroke="#44403C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="212" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B45309">1  coerce</text>

  <!-- up arrow: restore -->
  <line x1="1200" y1="186" x2="1200" y2="158" stroke="#57534E" stroke-width="1.5" marker-end="url(#arrow-back)"/>
  <text x="1188" y="178" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#57534E">restore type  4</text>

  <!-- ========== TRANSPORTS ========== -->
  <rect x="40" y="190" width="1320" height="210" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="60" y="214" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#1D4ED8">TRANSPORTS</text>
  <text x="180" y="214" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1E40AF">BaseTransport protocol — implementations do not import each other</text>

  <!-- JSON -->
  <rect x="60" y="230" width="400" height="108" rx="10" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="80" y="256" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#1C1917">JSON  ·  REST</text>
  <text x="80" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1D4ED8">POST /forecast</text>
  <text x="80" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#44403C">curl, any HTTP client</text>
  <text x="80" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">coerce on the server</text>

  <!-- Arrow IPC -->
  <rect x="480" y="230" width="400" height="108" rx="10" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="500" y="256" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#1C1917">Arrow IPC  ·  Python client</text>
  <text x="500" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1D4ED8">POST /forecast/bytes</text>
  <text x="500" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#44403C">fomo.client.Client</text>
  <text x="500" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">coerce on the client, bytes on the wire</text>

  <!-- future slot -->
  <rect x="900" y="230" width="440" height="108" rx="10" fill="none" stroke="#93C5FD" stroke-dasharray="6 5"/>
  <text x="920" y="256" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#64748B">Future transport</text>
  <text x="920" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748B">gRPC  ·  in-process  ·  …</text>
  <text x="920" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716C">same protocol, no runtime change</text>
  <text x="920" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94A3B8">slot</text>

  <!-- canonical bar -->
  <rect x="60" y="350" width="1280" height="36" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="80" y="373" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#92400E">canonical  ·</text>
  <text x="168" y="373" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#1C1917">CoercedForecastRequest  (Narwhals DataFrame)</text>
  <text x="1320" y="373" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#78716C">history / future / static</text>

  <!-- down to scheduler -->
  <line x1="200" y1="400" x2="200" y2="426" stroke="#44403C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="212" y="418" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#44403C">2  schedule</text>
  <line x1="1200" y1="426" x2="1200" y2="400" stroke="#57534E" stroke-width="1.5" marker-end="url(#arrow-back)"/>
  <text x="1188" y="418" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#57534E">CoercedForecastResponse  3</text>

  <!-- ========== SCHEDULER ========== -->
  <rect x="40" y="430" width="1320" height="72" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="60" y="454" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#047857">SCHEDULER</text>
  <text x="60" y="480" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#1C1917">Route by model id</text>
  <text x="220" y="480" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#065F46">request.model  →  executors[id].predict(coerced)</text>
  <text x="1340" y="480" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#047857">records latency on Stats</text>

  <!-- down to runtime -->
  <line x1="700" y1="502" x2="700" y2="528" stroke="#44403C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== RUNTIME ========== -->
  <rect x="40" y="532" width="1320" height="328" rx="12" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="60" y="556" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#6D28D9">RUNTIME</text>
  <text x="148" y="556" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5B21B6">Executor protocol — plugins are independent; each owns convert and execute</text>

  <!-- independence gutter -->
  <line x1="700" y1="572" x2="700" y2="792" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="700" y="586" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.08em" fill="#7C3AED">NO SHARED IMPORTS</text>

  <!-- sktime backend -->
  <rect x="60" y="598" width="620" height="188" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="80" y="626" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#1C1917">sktime executor</text>
  <rect x="248" y="608" width="72" height="22" rx="11" fill="#EDE9FE"/>
  <text x="284" y="624" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5B21B6">in tree</text>

  <rect x="80" y="644" width="280" height="120" rx="8" fill="#FAF5FF" stroke="#DDD6FE"/>
  <text x="96" y="668" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#6D28D9">Converter</text>
  <text x="96" y="690" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1C1917">nw.DataFrame</text>
  <text x="96" y="708" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">↓  from_request</text>
  <text x="96" y="726" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1C1917">y, X, fh  (pandas)</text>
  <text x="96" y="748" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">↑  to_response  →  nw</text>

  <rect x="376" y="644" width="280" height="120" rx="8" fill="#FAF5FF" stroke="#DDD6FE"/>
  <text x="392" y="668" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#6D28D9">Execute</text>
  <text x="392" y="690" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1C1917">forecaster.fit(y, X, fh)</text>
  <text x="392" y="708" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1C1917">forecaster.predict(X, fh)</text>
  <text x="392" y="730" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">optional predict_quantiles</text>
  <text x="392" y="748" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">dummy, chronos-2, timesfm-2.5, …</text>

  <!-- pytorch-forecasting backend -->
  <rect x="720" y="598" width="620" height="188" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="740" y="626" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#1C1917">pytorch-forecasting executor</text>
  <rect x="1008" y="608" width="64" height="22" rx="11" fill="#EDE9FE"/>
  <text x="1040" y="624" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5B21B6">plugin</text>

  <rect x="740" y="644" width="280" height="120" rx="8" fill="#FAF5FF" stroke="#DDD6FE"/>
  <text x="756" y="668" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#6D28D9">Converter</text>
  <text x="756" y="690" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1C1917">nw.DataFrame</text>
  <text x="756" y="708" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">↓  own mapping</text>
  <text x="756" y="726" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1C1917">TimeSeriesDataSet, …</text>
  <text x="756" y="748" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">does not use sktime converter</text>

  <rect x="1036" y="644" width="280" height="120" rx="8" fill="#FAF5FF" stroke="#DDD6FE"/>
  <text x="1052" y="668" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#6D28D9">Execute</text>
  <text x="1052" y="690" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#44403C">same Executor surface</text>
  <text x="1052" y="708" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1C1917">load() · predict()</text>
  <text x="1052" y="730" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">registered independently</text>
  <text x="1052" y="748" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">stub — not implemented</text>

  <!-- resources / health -->
  <rect x="60" y="798" width="1280" height="44" rx="8" fill="#FFFFFF" stroke="#DDD6FE"/>
  <text x="80" y="825" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5B21B6">Resources</text>
  <text x="168" y="825" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1917">GET /health</text>
  <text x="300" y="825" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1917">GET /models</text>
  <text x="428" y="825" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1917">GET /stats</text>
  <text x="1340" y="825" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716C">process RSS · per-model load / warmup / latency</text>

  <!-- footer -->
  <text x="40" y="886" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#A8A29E">Solid boxes are in the tree today. Dashed transport is a protocol slot. Each executor converts Narwhals to its own native types and back.</text>
</svg>
