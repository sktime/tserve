# Prove the Dockerfile still builds and the resulting server answers GET /health.
name: Build Docker image

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # needed to export the GHA layer cache below

jobs:
  build:
    name: build image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build only and do not push. load:true puts the image on the runner so we can
      # docker run it. GHA cache keeps the heavy uv/torch layers across runs.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: fomo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the default image (naive) and wait until /health returns {"status":"ok"}.
      # uv/torch import can take a bit, so poll for up to ~2 minutes. Always dump
      # logs and remove the container, including on timeout.
      - name: Health check
        run: |
          docker run -d --name fomo-ci -p 127.0.0.1:8000:8000 fomo:ci
          trap 'docker logs fomo-ci; docker rm -f fomo-ci' EXIT

          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health | jq -e '.status == "ok"' >/dev/null 2>&1; then
              echo "health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "health check timed out"
          exit 1
