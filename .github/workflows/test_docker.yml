name: Build Docker image

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: build image (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Bake base
        uses: docker/bake-action@v6
        env:
          TSERVE_IMAGE: tserve
        with:
          source: .
          files: ./docker-bake.hcl
          targets: base
          load: true
          provenance: false
          set: |
            *.platform=${{ matrix.platform }}
            *.cache-from=type=gha,scope=${{ matrix.platform }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.platform }}

      # Boot the loaded image and wait until /health returns {"status":"ok"}.
      # Always dump logs and remove the container, including on timeout.
      - name: Health check
        run: |
          docker run -d --name tserve -p 127.0.0.1:8000:8000 tserve:base
          trap 'docker logs tserve; docker rm -f tserve' EXIT

          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health | jq -e '.status == "ok"' >/dev/null 2>&1; then
              echo "health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "health check timed out"
          exit 1
