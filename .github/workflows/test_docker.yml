name: Build Docker image

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: build image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Bake base
        uses: docker/bake-action@v6
        with:
          source: .
          files: ./docker-bake.hcl
          targets: base
          load: true
          provenance: false
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
          vars: |
            FOMO_IMAGE=fomo

      # Boot the loaded image and wait until /health returns {"status":"ok"}.
      # Always dump logs and remove the container, including on timeout.
      - name: Health check
        run: |
          docker run -d --name fomo-ci -p 127.0.0.1:8000:8000 fomo:base
          trap 'docker logs fomo-ci; docker rm -f fomo-ci' EXIT

          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health | jq -e '.status == "ok"' >/dev/null 2>&1; then
              echo "health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "health check timed out"
          exit 1
