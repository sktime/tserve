site_name: FoMo
site_description: Time series foundation model inference server
site_url: https://fomo.readthedocs.io
site_author: FoMo authors

repo_name: sktime/fomo
repo_url: https://github.com/sktime/fomo
edit_uri: edit/main/docs/

copyright: Copyright &copy; FoMo authors

theme:
  name: material
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sktime/fomo
      name: FoMo on GitHub
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/geetu040/fomo
      name: FoMo images on Docker Hub
    - icon: material/bug
      link: https://github.com/sktime/fomo/issues
      name: Report an issue

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_style: numpy
            docstring_section_style: table
            filters: ["!^_"]
            group_by_category: true
            heading_level: 2
            inherited_members: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_bases: false
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: false
            show_symbol_type_toc: false
            signature_crossrefs: true
            summary: false

watch:
  - src
  - docs
  - includes

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  omitted_files: warn
  absolute_links: ignore
  unrecognized_links: warn
  anchors: warn

nav:
  - Home:
      - Getting started: index.md
      - Overview: overview.md
  - Server:
      - server/index.md
      - Docker: server/docker.md
      - From source: server/source.md
      - Live objects: server/live-objects.md
      - Models from a directory: server/models-dir.md
      - Dashboard: server/dashboard.md
  - Models:
      - Load models: models/index.md
      - Catalog: models/catalog.md
  - Client:
      - HTTP: client/http.md
      - Python: client/python.md
  - Reference:
      - HTTP API: reference/http.md
      - CLI: reference/cli.md
      - Python API: reference/api.md
      - Errors: reference/errors.md
      - Development: reference/development.md
