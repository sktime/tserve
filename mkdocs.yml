site_name: FoMo
site_description: Time series foundation model inference server
site_url: https://fomo.readthedocs.io

repo_name: sktime/fomo
repo_url: https://github.com/sktime/fomo
edit_uri: edit/main/docs/

copyright: Copyright &copy; FoMo authors

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_style: numpy
            docstring_section_style: table
            filters: ["!^_"]
            group_by_category: true
            heading_level: 2
            inherited_members: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_bases: false
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: false
            show_symbol_type_toc: false
            signature_crossrefs: true
            summary: false

watch:
  - src
  - docs

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  omitted_files: warn
  absolute_links: ignore
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Overview: overview.md
  - Server: walkthrough/server.md
  - Models: walkthrough/models.md
  - HTTP: walkthrough/http.md
  - Python: walkthrough/python.md
  - Dashboard: walkthrough/dashboard.md
  - Docker: walkthrough/docker.md
  - Reference:
      - HTTP API: reference/http.md
      - CLI: reference/cli.md
      - Python API: reference/api.md
      - Errors: reference/errors.md
      - Development: walkthrough/development.md
