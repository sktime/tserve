# FoMo images: same Dockerfile, different FOMO_EXTRAS.
# Each service has profiles [cpu|gpu, <name>] so you can select by backend or by model.
#
# Build / Push / Run
#   docker compose build granite           # build
#   docker compose push granite            # push
#   docker compose up granite              # run
#   docker compose build --push granite    # build and push
#
# Select services with profiles
#   --profile cpu                     all CPU services
#   --profile gpu                     all GPU services
#   --profile granite                 granite and granite-gpu
#   --profile cpu --profile granite   granite only
#
# Override image name (default: sktime/fomo:<tag>)
#   FOMO_IMAGE=ghcr.io/myorg/fomo docker compose --profile cpu build
#   FOMO_IMAGE=myregistry/fomo docker compose --profile granite push
#   FOMO_IMAGE=localhost/fomo docker compose --profile granite up granite
#
# Optional Hugging Face token (faster Hub downloads; read token is enough):
#   HF_TOKEN=hf_... docker compose --profile granite up granite
#   or put HF_TOKEN=hf_... in a .env next to this file
#
# Common useful commands:
#   docker compose --profile cpu build --push              # build and push all CPU images
#   docker compose --profile gpu build --push              # build and push all GPU images
#   docker compose --profile all build --push              # build and push CPU and GPU full images
#   docker compose --profile granite build --push          # granite + granite-gpu
#   docker compose build --push granite                    # granite
#   docker compose up granite                              # run granite


name: fomo

x-build: &build
  context: .
  dockerfile: Dockerfile

x-ports: &ports
  ports:
    - "8000:8000"

x-hf: &hf
  environment:
    HF_TOKEN: ${HF_TOKEN:-}

x-cmd-base: &cmd-base
  command: ["--load-models", "naive"]

x-cmd-hub: &cmd-hub
  command: ["--load-models", "naive", "chronos-bolt-tiny", "timesfm-2.5", "ttm-r3-52-16"]

x-cmd-chronos: &cmd-chronos
  command: ["--load-models", "naive", "chronos-2", "chronos-bolt-tiny"]

x-cmd-kronos: &cmd-kronos
  command: ["--load-models", "naive", "kronos", "windfm"]

x-cmd-granite: &cmd-granite
  command: ["--load-models", "naive", "flowstate", "ttm-r3-52-16"]

x-cmd-moirai: &cmd-moirai
  command: ["--load-models", "naive", "moirai-2", "lagllama"]

x-cmd-tirex: &cmd-tirex
  command: ["--load-models", "naive", "tirex"]

x-cmd-toto: &cmd-toto
  command: ["--load-models", "naive", "toto-2.0-4m"]

x-cmd-mantis: &cmd-mantis
  command: ["--load-models", "naive", "mantis-8m"]

x-cmd-all: &cmd-all
  command:
    [
      "--load-models",
      "naive",
      "chronos-2",
      "timesfm-2.5",
      "ttm-r3-52-16",
      "toto-2.0-4m",
      "mantis-8m",
      "kronos",
      "tirex",
      "moirai-2",
      "flowstate",
    ]

services:
  base:
    <<: [*cmd-base, *ports, *hf]
    profiles: [cpu, base]
    image: ${FOMO_IMAGE:-sktime/fomo}:base
    build:
      <<: *build
      args:
        FOMO_EXTRAS: ""
      tags:
        - ${FOMO_IMAGE:-sktime/fomo}:base

  hub:
    <<: [*cmd-hub, *ports, *hf]
    profiles: [cpu, hub]
    image: ${FOMO_IMAGE:-sktime/fomo}:hub
    build:
      <<: *build
      args:
        FOMO_EXTRAS: hub
      tags:
        - ${FOMO_IMAGE:-sktime/fomo}:hub

  chronos:
    <<: [*cmd-chronos, *ports, *hf]
    profiles: [cpu, chronos]
    image: ${FOMO_IMAGE:-sktime/fomo}:chronos
    build:
      <<: *build
      args:
        FOMO_EXTRAS: chronos
      tags:
        - ${FOMO_IMAGE:-sktime/fomo}:chronos

  kronos:
    <<: [*cmd-kronos, *ports, *hf]
    profiles: [cpu, kronos]
    image: ${FOMO_IMAGE:-sktime/fomo}:kronos
    build:
      <<: *build
      args:
        FOMO_EXTRAS: kronos
      tags:
        - ${FOMO_IMAGE:-sktime/fomo}:kronos

  granite:
    <<: [*cmd-granite, *ports, *hf]
    profiles: [cpu, granite]
    image: ${FOMO_IMAGE:-sktime/fomo}:granite
    build:
      <<: *build
      args:
        FOMO_EXTRAS: granite
      tags:
        - ${FOMO_IMAGE:-sktime/fomo}:granite

  moirai:
    <<: [*cmd-moirai, *ports, *hf]
    profiles: [cpu, moirai]
    image: ${FOMO_IMAGE:-sktime/fomo}:moirai
    build:
      <<: *build
      args:
        FOMO_EXTRAS: moirai
      tags:
        - ${FOMO_IMAGE:-sktime/fomo}:moirai

  tirex:
    <<: [*cmd-tirex, *ports, *hf]
    profiles: [cpu, tirex]
    image: ${FOMO_IMAGE:-sktime/fomo}:tirex
    build:
      <<: *build
      args:
        FOMO_EXTRAS: tirex
      tags:
        - ${FOMO_IMAGE:-sktime/fomo}:tirex

  toto:
    <<: [*cmd-toto, *ports, *hf]
    profiles: [cpu, toto]
    image: ${FOMO_IMAGE:-sktime/fomo}:toto
    build:
      <<: *build
      args:
        FOMO_EXTRAS: toto
      tags:
        - ${FOMO_IMAGE:-sktime/fomo}:toto

  mantis:
    <<: [*cmd-mantis, *ports, *hf]
    profiles: [cpu, mantis]
    image: ${FOMO_IMAGE:-sktime/fomo}:mantis
    build:
      <<: *build
      args:
        FOMO_EXTRAS: mantis
      tags:
        - ${FOMO_IMAGE:-sktime/fomo}:mantis

  all:
    <<: [*cmd-all, *ports, *hf]
    profiles: [cpu, all]
    image: ${FOMO_IMAGE:-sktime/fomo}:all
    build:
      <<: *build
      args:
        FOMO_EXTRAS: all
      tags:
        - ${FOMO_IMAGE:-sktime/fomo}:all

  hub-gpu:
