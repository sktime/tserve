    profiles: [gpu, kronos]
    image: ${FOMO_IMAGE:-sktime/fomo}:kronos-gpu
    build:
      <<: *build
      args:
        FOMO_EXTRAS: kronos gpu
      tags:
        - ${FOMO_IMAGE:-sktime/fomo}:kronos-gpu

  granite-gpu:
    <<: [*cmd-granite, *ports, *hf]
    profiles: [gpu, granite]
    image: ${FOMO_IMAGE:-sktime/fomo}:granite-gpu
    build:
      <<: *build
      args:
        FOMO_EXTRAS: granite gpu
      tags:
        - ${FOMO_IMAGE:-sktime/fomo}:granite-gpu

  moirai-gpu:
    <<: [*cmd-moirai, *ports, *hf]
    profiles: [gpu, moirai]
    image: ${FOMO_IMAGE:-sktime/fomo}:moirai-gpu
    build:
      <<: *build
      args:
