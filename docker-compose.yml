    profiles: [gpu, mantis]
    image: ${FOMO_IMAGE:-sktime/fomo}:mantis-gpu
    build:
      <<: *build
      args:
        FOMO_EXTRAS: mantis gpu
      tags:
        - ${FOMO_IMAGE:-sktime/fomo}:mantis-gpu

  all-gpu:
    <<: [*cmd-all, *ports, *hf]
    profiles: [gpu, all]
    image: ${FOMO_IMAGE:-sktime/fomo}:all-gpu
    build:
      <<: *build
      args:
