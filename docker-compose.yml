        FOMO_EXTRAS: moirai
      tags:
        - ${FOMO_IMAGE:-sktime/fomo}:moirai

  tirex:
    <<: [*cmd-tirex, *ports, *hf]
    profiles: [cpu, tirex]
    image: ${FOMO_IMAGE:-sktime/fomo}:tirex
    build:
      <<: *build
      args:
        FOMO_EXTRAS: tirex
      tags:
        - ${FOMO_IMAGE:-sktime/fomo}:tirex

  toto:
