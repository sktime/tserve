[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fomo"  # maybe fomo-ts (or fomots)?
version = "0.1.0"
authors = [
  {name = "Tobias Pitters", email = "tobias.pitters@sktime.net"},
  {name = "Armaghan Shakir", email = "armaghan.shakir@sktime.net"},
]
description = "A Time Series Foundation Model Inference Server"
readme = {file = "README.md", content-type = "text/markdown"}
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["time series", "forecasting", "foundation models", "inference"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
# note: this has to stay inside [project]. It used to sit below [project.urls],
# where toml reads it as project.urls.dependencies - so nothing was declared.
dependencies = [
  "pydantic",
  "narwhals",
  "pyarrow>=25.0.1",
]

[project.optional-dependencies]
client = ["fomo[http]"]
server = ["fastapi", "python-multipart", "uvicorn", "fomo[sktime]"]
# transports specific dependencies
http = ["httpx2", "python-multipart"]
# executors specific dependencies
sktime = [
  "sktime @ git+https://github.com/sktime/sktime.git@80d868d398b62858bd46248b02eb256cdce41d45",
  "skpro",
]
# estimators-general-deps, torch excluded so CPU vs `--extra gpu` can pick an index
hf = [
  "fomo[sktime]",
  "transformers",
  "accelerate>=0.26.0",
]
# ChronosForecaster/TinyTimeMixerForecaster/TimesFM2Forecaster
hub = ["fomo[hf]", "torch"]
# Chronos2Forecaster
chronos = ["fomo[hf]", "chronos-forecasting>=2.0.0", "torch"]
# KronosForecaster/WindFMForecaster
kronos = [
  "fomo[sktime]",
  "einops",
  "huggingface_hub",
  "safetensors",
  "torch",
]
# FlowState/PatchTSMixer
granite = ["fomo[hf]", "granite-tsfm>=0.3.5", "torch"]
# MOIRAI/Moirai2/LagLlama
moirai = [
  "fomo[hf]",
  "gluonts>=0.14.0; python_version < '3.14'",
  "lightning>=2.0; python_version < '3.14'",
  "hydra-core; python_version < '3.14'",
  "torch",
]
# TiRexForecaster
tirex = ["fomo[hf]", "tirex-ts", "torch"]
# Toto2Forecaster (toto-ts for Toto v1 pins transformers and is omitted)
toto = ["fomo[hf]", "toto-models", "skpro", "torch"]
# MantisForecaster
mantis = ["fomo[hf]", "mantis-tsfm>=1.0.0", "torch"]
full = ["fomo[chronos,kronos,granite,moirai,tirex,toto,mantis]", "torch"]
# for pip (alternate for `uv sync --all-extras`)
all-extras = ["fomo[client,server,full]"]
# pair with any extra above: `uv sync --extra hub --extra gpu`
gpu = ["torch"]
# also extras so `pip install -e ".[dev]"` / `".[docs]"` work (no uv, no PEP 735)
dev = [
  "pytest",
  "pre-commit>=4",
  "ruff>=0.16.5",
  "ty>=0.0.75",
  "codespell>=2.4.3",
]
docs = [
  "fomo[server,client]",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.30",
]

[project.scripts]
fomo = "fomo.cli.main:main"

[project.urls]
Homepage = "https://fomo.readthedocs.io"
Documentation = "https://fomo.readthedocs.io"
Repository = "https://github.com/sktime/fomo"
Issues = "https://github.com/sktime/fomo/issues"

[dependency-groups]
# same packages as the extras, so `uv sync --group dev` stays valid
dev = ["fomo[dev]"]
docs = ["fomo[docs]"]
# empty, only exists so the lock can fork CPU vs GPU torch
cpu-fork = []

[tool.uv]
# pytorch-cpu also mirrors a few generic wheels at old versions; consider
# both indexes so those packages still resolve from PyPI.
index-strategy = "unsafe-best-match"
# fork the lock: default extras use the CPU index, `--extra gpu` uses PyPI
conflicts = [
  [{ extra = "gpu" }, { group = "cpu-fork" }],
]

[tool.uv.sources]
# `--extra gpu` takes PyPI torch (CUDA on Linux/Windows, MPS on macOS).
# Without it, the extra CPU index below supplies the +cpu wheel.
torch = [
  { index = "pypi", extra = "gpu" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.hatch.metadata]
# PEP 508 Git URLs in extras (sktime pin) are otherwise rejected by hatchling
allow-direct-references = true

[tool.hatch.build]
# repo .gitignore has `*.html`; hatchling would drop the dashboard from
# pip wheels otherwise (uv editable installs still see the file on disk)
artifacts = [
  "src/fomo/server/static/*.html",
]

[tool.hatch.build.targets.wheel]
# src layout: the package lives at src/fomo, so once installed
# (`pip install -e ".[server,full]"`) `from fomo.scheduling.scheduler import Scheduler`
# works from anywhere
packages = ["src/fomo"]

[tool.hatch.build.targets.wheel.force-include]
"src/fomo/server/static/index.html" = "fomo/server/static/index.html"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "FURB",
  "S",
  "PT",
  "RUF",
  "D",
]
ignore = [
  "S101",  # assert is fine in tests and contracts
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
# craft strings are data (HF model paths); wrapping them hurts grep
"src/fomo/runtime/registry/sktime_registry.py" = ["E501"]
# D is phased: public API first (client, types, cli). sktime ignores D in tests.
"**/tests/**" = ["S", "D"]
"tests/**" = ["S", "D"]
"src/fomo/runtime/**" = ["D"]
"src/fomo/server/**" = ["D"]
"src/fomo/scheduling/**" = ["D"]
"src/fomo/logging/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["fomo"]

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[tool.ty.src]
include = ["src"]

[tool.ty.analysis]
# Optional extras are not installed in the code-quality env (`uv sync --group dev`).
# http → httpx2; server → fastapi, uvicorn; sktime → pandas, sktime.
allowed-unresolved-imports = [
  "httpx2.**",
  "fastapi.**",
  "uvicorn.**",
  "pandas.**",
  "sktime.**",
]

[tool.codespell]
# skip caches, venvs, lockfiles, and local untracked dirs
skip = ".git,.venv,.ruff_cache,.ty_cache,.pytest_cache,.mypy_cache,uv.lock,__pycache__,*.pyc,my-models,notes,scripts"
