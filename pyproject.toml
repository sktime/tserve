[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fomo"  # maybe fomo-ts (or fomots)?
version = "0.1.0"
authors = [
  {name = "Tobias Pitters", email = "tobias.pitters@sktime.net"},
# add your names here
]
description = "A Time Series Foundation Model Inference Server"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
keywords = ["time series", "forecasting", "foundation models", "inference"]
classifiers = [
  # How mature is this project? Common values are
  #   1 - Pre-Alpha
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 2 - Pre-Alpha",

  # Indicate who your project is intended for
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
# note: this has to stay inside [project]. It used to sit below [project.urls],
# where toml reads it as project.urls.dependencies - so nothing was declared.
dependencies = [
	"fastapi",
	"narwhals",
	"sktime",
	"skpro",
	"pydantic",
	# estimators-general-deps
	"torch",
	"transformers",
	"accelerate",
	"huggingface_hub",
	"hf-xet",
	"safetensors",
	"einops",
	"tqdm",
	"requests",
	"pytest",
	# estimators-specific-deps
	"chronos-forecasting>=2.0.0",  # Chronos2Forecaster
	"aurora-model==0.2.0", "torchvision",  # AuroraForecaster
	"gluonts>=0.14.0", "lightning>=2.0", "hydra-core",  # MOIRAI/Moirai2/LagLlama
	"granite-tsfm>=0.3.5",  # FlowState/PatchTSMixer/TSPulse
	"tirex-ts",  # TiRexForecaster
]

[project.optional-dependencies]
# todo: can we set one as default and if the other is chosen get rid of the other?
# maybe just using "standard" for one and requiring users to install fomo[standard]?
pandas = ["pandas"]
polars = ["polars"]

[project.urls]
# todo: add homepage once it is ready
# HomePage = ""

[tool.hatch.build.targets.wheel]
# src layout: the package lives at src/fomo, so once installed
# (`uv pip install -e .`) `from fomo.scheduling.scheduler import Scheduler`
# works from anywhere
packages = ["src/fomo"]
