[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fomo"  # maybe fomo-ts (or fomots)?
version = "0.1.0"
authors = [
  {name = "Tobias Pitters", email = "tobias.pitters@sktime.net"},
  {name = "Armaghan Shakir", email = "armaghan.shakir@sktime.net"},
]
description = "A Time Series Foundation Model Inference Server"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
keywords = ["time series", "forecasting", "foundation models", "inference"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
# note: this has to stay inside [project]. It used to sit below [project.urls],
# where toml reads it as project.urls.dependencies - so nothing was declared.
dependencies = [
	"pydantic",
	"narwhals",
	"pyarrow>=25.0.1",
]

[project.optional-dependencies]
client = ["fomo[http]"]
server = ["fastapi", "python-multipart", "uvicorn"]
# transports specific dependencies
http = ["httpx", "python-multipart"]
grpc = ["grpcio"]
# executors specific dependencies
sktime-lite = ["sktime"]
sktime = [
	"sktime",
	"skpro",
	# estimators-general-deps
	"torch",
	"transformers",
	"accelerate",
	"huggingface_hub",
	"hf-xet",
	"safetensors",
	"einops",
	"tqdm",
	# estimators-specific-deps
	# Chronos2Forecaster
	"chronos-forecasting>=2.0.0",
	# AuroraForecaster
	"aurora-model==0.2.0",
	"torchvision",
	# MOIRAI/Moirai2/LagLlama
	"gluonts>=0.14.0",
	"lightning>=2.0",
	"hydra-core",
	# FlowState/PatchTSMixer/TSPulse
	"granite-tsfm>=0.3.5",
	# TiRexForecaster
	"tirex-ts",
]
pytorch-forecasting = ["pytorch-forecasting"]

[project.scripts]
fomo = "fomo.cli.main:main"

[project.urls]
# todo: add homepage once it is ready
# HomePage = ""

[dependency-groups]
dev = [
  "pytest",
  "pre-commit>=4",
  "ruff>=0.16.5",
  "ty>=0.0.75",
  "codespell>=2.4.3",
]

[tool.hatch.build.targets.wheel]
# src layout: the package lives at src/fomo, so once installed
# (`uv pip install -e ".[server,sktime]"`) `from fomo.scheduling.scheduler import Scheduler`
# works from anywhere
packages = ["src/fomo"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "FURB",
  "S",
  "PT",
  "RUF",
  "D",
]
ignore = [
  "S101",  # assert is fine in tests and contracts
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
# craft strings are data (HF model paths); wrapping them hurts grep
"src/fomo/runtime/registry/sktime_registry.py" = ["E501"]
# D is phased: public API first (client, types, cli). sktime ignores D in tests.
"**/tests/**" = ["S", "D"]
"tests/**" = ["S", "D"]
"src/fomo/runtime/**" = ["D"]
"src/fomo/server/**" = ["D"]
"src/fomo/scheduling/**" = ["D"]
"src/fomo/logging/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["fomo"]

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[tool.ty.src]
include = ["src"]

[tool.ty.analysis]
# Optional extras are not installed in the code-quality env (`uv sync --group dev`).
# http → httpx; server → fastapi, uvicorn; sktime-lite/sktime → pandas, sktime.
allowed-unresolved-imports = [
  "httpx.**",
  "fastapi.**",
  "uvicorn.**",
  "pandas.**",
  "sktime.**",
]

[tool.codespell]
# skip caches, venvs, lockfiles, and local untracked dirs
skip = ".git,.venv,.ruff_cache,.ty_cache,.pytest_cache,.mypy_cache,uv.lock,__pycache__,*.pyc,my-models,notes,scripts"
