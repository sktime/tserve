[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fomo"  # maybe fomo-ts (or fomots)?
version = "0.1.0"
authors = [
  {name = "Tobias Pitters", email = "tobias.pitters@sktime.net"},
  {name = "Armaghan Shakir", email = "armaghan.shakir@sktime.net"},
]
description = "A Time Series Foundation Model Inference Server"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
keywords = ["time series", "forecasting", "foundation models", "inference"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
# note: this has to stay inside [project]. It used to sit below [project.urls],
# where toml reads it as project.urls.dependencies - so nothing was declared.
dependencies = [
	"pydantic",
	"narwhals",
	"pyarrow>=25.0.1",
]

[project.optional-dependencies]
client = ["fomo[http]"]
server = ["fastapi", "uvicorn"]
# transports specific dependencies
http = ["httpx", "python-multipart"]
grpc = ["grpcio"]
# dataframe backend specific dependencies
pandas = ["pandas"]
polars = ["polars"]
# executors specific dependencies
sktime = [
	"sktime",
	"skpro",
	# estimators-general-deps
	"torch",
	"transformers",
	"accelerate",
	"huggingface_hub",
	"hf-xet",
	"safetensors",
	"einops",
	"tqdm",
	# estimators-specific-deps
	# Chronos2Forecaster
	"chronos-forecasting>=2.0.0",
	# AuroraForecaster
	"aurora-model==0.2.0",
	"torchvision",
	# MOIRAI/Moirai2/LagLlama
	"gluonts>=0.14.0",
	"lightning>=2.0",
	"hydra-core",
	# FlowState/PatchTSMixer/TSPulse
	"granite-tsfm>=0.3.5",
	# TiRexForecaster
	"tirex-ts",
]
pytorch-forecasting = ["pytorch-forecasting"]

[project.scripts]
fomo = "fomo.cli.main:main"

[project.urls]
# todo: add homepage once it is ready
# HomePage = ""

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
# src layout: the package lives at src/fomo, so once installed
# (`uv pip install -e ".[server,sktime]"`) `from fomo.scheduling.scheduler import Scheduler`
# works from anywhere
packages = ["src/fomo"]

[tool.basedpyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
